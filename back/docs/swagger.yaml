basePath: /api
definitions:
  controllers.CopyDetail:
    properties:
      barcode:
        type: string
      id:
        type: integer
      is_borrowed:
        type: boolean
      loan_due_date:
        type: string
    type: object
  controllers.CopySummary:
    properties:
      barcode:
        type: string
      id:
        type: integer
    type: object
  controllers.CreateBookRequest:
    properties:
      author_first_name:
        type: string
      author_id:
        type: integer
      author_last_name:
        type: string
      deposit:
        type: number
      isbn:
        type: string
      location_id:
        type: integer
      title:
        type: string
    type: object
  controllers.CreateCopyRequest:
    properties:
      barcode:
        type: string
      loan_period_days:
        type: integer
    type: object
  controllers.CreateItemResponse:
    properties:
      id:
        type: integer
      message:
        type: string
    type: object
  controllers.CreateJournalRequest:
    properties:
      deposit:
        type: number
      issue_number:
        type: integer
      location_id:
        type: integer
      publication_date:
        type: string
      title:
        type: string
    type: object
  controllers.CreateUserRequest:
    properties:
      birth_date:
        type: string
      city:
        type: string
      department_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
      postal_code:
        type: string
      status:
        enum:
        - student
        - teacher
        - individual
        type: string
      street_name:
        type: string
      street_number:
        type: string
      study_year:
        type: string
    required:
    - birth_date
    - city
    - email
    - first_name
    - last_name
    - phone_number
    - postal_code
    - status
    - street_name
    - street_number
    type: object
  controllers.CreateUserResponse:
    properties:
      login:
        type: string
      message:
        type: string
      password:
        type: string
    type: object
  controllers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  controllers.HomeStats:
    properties:
      available_copy_count:
        type: integer
      book_count:
        type: integer
      journal_count:
        type: integer
      user_count:
        type: integer
    type: object
  controllers.IDResponse:
    properties:
      id:
        type: integer
    type: object
  controllers.LoanRequest:
    properties:
      barcode:
        type: string
      user_id:
        type: integer
    required:
    - barcode
    - user_id
    type: object
  controllers.LoginConflictResponse:
    properties:
      existing_login:
        type: string
      message:
        type: string
    type: object
  controllers.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  controllers.LoginResponse:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      message:
        type: string
      role:
        type: string
    type: object
  controllers.MessageResponse:
    properties:
      message:
        type: string
    type: object
  controllers.UpdateDepositRequest:
    properties:
      total_deposit:
        type: number
    type: object
  models.Author:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
    type: object
  models.Department:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  repositories.DepositInfo:
    properties:
      deposit_balance:
        type: number
      total_deposit:
        type: number
    type: object
  repositories.ItemLocation:
    properties:
      bay_number:
        type: integer
      level:
        type: integer
      shelf_number:
        type: integer
    type: object
  repositories.ItemResult:
    properties:
      author:
        type: string
      available_copies:
        type: integer
      deposit:
        type: number
      id:
        type: integer
      isbn:
        type: string
      issue_number:
        type: integer
      location:
        $ref: '#/definitions/repositories.ItemLocation'
      publication_date:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  repositories.LoanPreview:
    properties:
      barcode:
        type: string
      current_balance:
        type: number
      deposit:
        type: number
      new_balance:
        type: number
      title:
        type: string
    type: object
  repositories.LoanSummary:
    properties:
      barcode:
        type: string
      due_date:
        type: string
      id:
        type: integer
      overdue:
        type: boolean
      start_date:
        type: string
      title:
        type: string
    type: object
  repositories.LocationSummary:
    properties:
      bay_number:
        type: integer
      category_name:
        type: string
      id:
        type: integer
      level:
        type: integer
      shelf_number:
        type: integer
    type: object
  repositories.OverdueLoan:
    properties:
      barcode:
        type: string
      due_date:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      phone_number:
        type: string
      title:
        type: string
    type: object
  repositories.UserSummary:
    properties:
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      phone_number:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for managing a university library.
  title: Library API
  version: "1.0"
paths:
  /authors:
    get:
      description: Returns the list of available authors.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Author'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List authors
      tags:
      - Items
  /books:
    post:
      consumes:
      - application/json
      description: Creates a new book with an existing author or a new one.
      parameters:
      - description: Book data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.CreateItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Create a book
      tags:
      - Items
  /departments:
    get:
      description: Returns the list of school departments.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Department'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List departments
      tags:
      - Users
  /home:
    get:
      description: Returns global statistics about the library.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.HomeStats'
      summary: Home statistics
      tags:
      - Home
  /items:
    get:
      description: Advanced search for items (books/journals), or initial list without
        filters.
      parameters:
      - description: Title
        in: query
        name: title
        type: string
      - description: Author
        in: query
        name: author
        type: string
      - description: ISBN
        in: query
        name: isbn
        type: string
      - description: Barcode
        in: query
        name: barcode
        type: string
      - description: Journal issue number
        in: query
        name: issue_number
        type: string
      - description: Available only
        in: query
        name: available
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repositories.ItemResult'
            type: array
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Search items
      tags:
      - Items
  /items/{id}/copies:
    get:
      description: Returns the copies of an item that are not on loan.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.CopySummary'
            type: array
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List available copies
      tags:
      - Copies
    post:
      consumes:
      - application/json
      description: Creates a copy of a given item.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Copy data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateCopyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.IDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Create a copy
      tags:
      - Copies
  /items/{id}/copies/all:
    get:
      description: Returns every copy of an item.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.CopyDetail'
            type: array
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List all copies
      tags:
      - Copies
  /journals:
    post:
      consumes:
      - application/json
      description: Creates a new journal issue.
      parameters:
      - description: Journal data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateJournalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.CreateItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Create a journal
      tags:
      - Items
  /loans:
    get:
      description: Returns the active loans of a given user.
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repositories.LoanSummary'
            type: array
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List a user's loans
      tags:
      - Loans
    post:
      consumes:
      - application/json
      description: Records the loan of a copy for a user.
      parameters:
      - description: Loan request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.LoanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Record a loan
      tags:
      - Loans
  /loans/{id}:
    delete:
      description: Marks the copy as returned and refunds the deposit.
      parameters:
      - description: Copy ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Return a copy
      tags:
      - Loans
  /loans/check:
    get:
      description: Checks whether a copy can be borrowed and returns a preview.
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      - description: Copy barcode
        in: query
        name: barcode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repositories.LoanPreview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Check a loan
      tags:
      - Loans
  /loans/overdue:
    get:
      description: Returns every overdue loan.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repositories.OverdueLoan'
            type: array
        "204":
          description: No Content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List overdue loans
      tags:
      - Loans
  /locations:
    get:
      description: Returns the list of available locations.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repositories.LocationSummary'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List locations
      tags:
      - Items
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user (student/teacher/individual) or a librarian.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /users:
    post:
      consumes:
      - application/json
      description: Creates a student, a teacher or an individual.
      parameters:
      - description: User data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/controllers.LoginConflictResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Create a user
      tags:
      - Users
  /users/{id}/deposit:
    get:
      description: Returns the available deposit balance and the total deposit.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repositories.DepositInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get a user's deposit
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates a user's total deposit and recomputes their balance.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New deposit
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateDepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repositories.DepositInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Update the total deposit
      tags:
      - Users
  /users/search:
    get:
      description: Searches users by last name, first name, postal code or phone number.
      parameters:
      - description: Last name
        in: query
        name: last_name
        type: string
      - description: First name
        in: query
        name: first_name
        type: string
      - description: Postal code
        in: query
        name: postal_code
        type: string
      - description: Phone number
        in: query
        name: phone_number
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repositories.UserSummary'
            type: array
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Search users
      tags:
      - Users
swagger: "2.0"
